[project]
name = "trez-realestate-agent"
version = "0.1.0"
description = "WhatsApp lead agent for Trez Enterprises (see ARCHITECTURE.md)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pillow>=11.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
